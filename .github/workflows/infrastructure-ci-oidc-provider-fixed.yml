name: Infrastructure CI/CD and Argo CD

on:
  push:
    branches:
      - dev
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infrastructure-ci.yml"

  pull_request:
    branches:
      - uat
      - production
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infrastructure-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: read

concurrency:
  group: infrastructure-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ROLE_TO_ASSUME: ${{ vars.ROLE_TO_ASSUME }}
  ARGOCD_NAMESPACE: ${{ vars.ARGOCD_NAMESPACE || 'argocd' }}
  ARGOCD_RELEASE_NAME: ${{ vars.ARGOCD_RELEASE_NAME || 'argocd' }}
  ARGOCD_CHART_VERSION: ${{ vars.ARGOCD_CHART_VERSION || '10.1.4' }}
  ARGOCD_VALUES_FILE: ${{ vars.ARGOCD_VALUES_FILE || 'platform/argocd/values.yaml' }}
  KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION || 'v1.31.0' }}
  HELM_VERSION: ${{ vars.HELM_VERSION || 'v3.16.4' }}
  GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
  GITOPS_BRANCH: ${{ vars.GITOPS_BRANCH || 'dev' }}
#  GITOPS_ROOT_APPLICATION_PATH: ${{ vars.GITOPS_ROOT_APPLICATION_PATH || 'bootstrap/root-application.yaml' }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'task-tracking-infrastructure' }}
  SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME || 'Task Tracking Infrastructure' }}

jobs:
  resolve-context:
    name: Resolve deployment context
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.context.outputs.environment }}
      operation: ${{ steps.context.outputs.operation }}
      should_plan: ${{ steps.context.outputs.should_plan }}
      should_apply: ${{ steps.context.outputs.should_apply }}
      working_directory: ${{ steps.context.outputs.working_directory }}
      state_key: ${{ steps.context.outputs.state_key }}

    steps:
      - name: Resolve environment and operation
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          PR_MERGED: ${{ github.event.pull_request.merged || false }}
        run: |
          set -euo pipefail

          environment=""
          operation=""
          should_plan="false"
          should_apply="false"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$REF_NAME" in
              dev|uat|production)
                environment="$REF_NAME"
                operation="plan"
                should_plan="true"
                ;;
              *)
                echo "Manual runs must be started from dev, uat, or production."
                exit 1
                ;;
            esac

          elif [[ "$EVENT_NAME" == "push" && "$GIT_REF" == "refs/heads/dev" ]]; then
            environment="dev"
            operation="apply"
            should_plan="true"
            should_apply="true"

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "${SOURCE_BRANCH}:${TARGET_BRANCH}" in
              dev:uat)
                environment="uat"
                ;;
              uat:production)
                environment="production"
                ;;
              *)
                echo "Invalid promotion path: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
                echo "Allowed paths are dev -> uat and uat -> production."
                exit 1
                ;;
            esac

            if [[ "$EVENT_ACTION" == "closed" ]]; then
              if [[ "$PR_MERGED" == "true" ]]; then
                operation="apply"
                should_plan="true"
                should_apply="true"
              else
                operation="none"
              fi
            else
              operation="plan"
              should_plan="true"
            fi
          else
            echo "Unsupported workflow event."
            exit 1
          fi

          if [[ -z "$environment" ]]; then
            echo "Could not resolve the target environment."
            exit 1
          fi

          working_directory="infra/terraform/environments/${environment}"
          state_key="${PROJECT_NAME}/${environment}/terraform.tfstate"

          {
            echo "environment=$environment"
            echo "operation=$operation"
            echo "should_plan=$should_plan"
            echo "should_apply=$should_apply"
            echo "working_directory=$working_directory"
            echo "state_key=$state_key"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Infrastructure workflow context"
            echo
            echo "- Environment: \`$environment\`"
            echo "- Operation: \`$operation\`"
            echo "- Working directory: \`$working_directory\`"
            echo "- State key: \`$state_key\`"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-promotion:
    name: Validate promotion path
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed'
      }}

    steps:
      - name: Enforce branch promotion sequence
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          case "${SOURCE_BRANCH}:${TARGET_BRANCH}" in
            dev:uat)
              echo "Valid infrastructure promotion: dev -> uat"
              ;;
            uat:production)
              echo "Valid infrastructure promotion: uat -> production"
              ;;
            *)
              echo "Invalid infrastructure promotion: ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
              exit 1
              ;;
          esac

  terraform-format:
    name: Terraform format
    runs-on: ubuntu-latest

    if: ${{ needs.resolve-context.outputs.should_plan == 'true' }}

    needs:
      - resolve-context

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref || github.ref }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  checkov:
    name: Checkov infrastructure scan
    runs-on: ubuntu-latest

    if: ${{ needs.resolve-context.outputs.should_plan == 'true' }}

    needs:
      - resolve-context

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref || github.ref }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,github_actions
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
          skip_check: CKV_AWS_356,CKV_AWS_111,CKV_AWS_109,CKV_AWS_37,CKV_AWS_158,CKV_AWS_338,CKV2_AWS_5,CKV_AWS_144,CKV_AWS_18,CKV2_AWS_62

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-${{ needs.resolve-context.outputs.environment }}
          path: checkov.sarif
          if-no-files-found: warn

  trivy:
    name: Trivy repository and IaC scan
    runs-on: ubuntu-latest

    if: ${{ needs.resolve-context.outputs.should_plan == 'true' }}

    needs:
      - resolve-context

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref || github.ref }}

      - name: Verify Trivy ignore file
        shell: bash
        run: |
          set -euo pipefail

          test -f trivyignore || {
            echo "::error::The repository-root file 'trivyignore' was not found."
            exit 1
          }

          echo "Configured Trivy suppressions:"
          cat trivyignore

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          trivyignores: trivyignore
          skip-version-check: true

      - name: Upload Trivy SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-infrastructure-${{ needs.resolve-context.outputs.environment }}

      - name: Upload Trivy SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-infrastructure-${{ needs.resolve-context.outputs.environment }}-${{ github.run_id }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce HIGH and CRITICAL Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: true
          trivyignores: trivyignore
          skip-version-check: true

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest

    if: ${{ false }}

    needs:
      - resolve-context

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref || github.ref }}

      - name: Validate SonarQube configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SONAR_TOKEN" || {
            echo "SONAR_TOKEN GitHub secret is required."
            exit 1
          }

          test -n "$SONAR_HOST_URL" || {
            echo "SONAR_HOST_URL GitHub variable is required."
            exit 1
          }

          test -n "$SONAR_PROJECT_KEY" || {
            echo "SONAR_PROJECT_KEY is required."
            exit 1
          }

      - name: Run SonarQube scan and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/.terraform/**,**/tfplan,**/*.tfstate,**/*.tfstate.*,**/checkov.sarif,**/trivy-results.sarif
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Upload SonarQube task report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-task-report-${{ needs.resolve-context.outputs.environment }}-${{ github.run_id }}
          path: .scannerwork/report-task.txt
          if-no-files-found: warn
          retention-days: 30

  terraform-plan:
    name: Terraform plan - ${{ needs.resolve-context.outputs.environment }}
    runs-on: ubuntu-latest

    needs:
      - resolve-context
      - terraform-format
      - checkov
      - trivy
      - sonarqube

    if: >-
      ${{
        always() &&
        needs.resolve-context.outputs.should_plan == 'true' &&
        needs.terraform-format.result == 'success' &&
        needs.checkov.result == 'success' &&
        needs.trivy.result == 'success' &&
        (
          needs.sonarqube.result == 'success' ||
          needs.sonarqube.result == 'skipped'
        )
      }}

    environment:
      name: ${{ needs.resolve-context.outputs.environment }}

    env:
      TF_VAR_aws_assume_role_arn: ""

    defaults:
      run:
        working-directory: ${{ needs.resolve-context.outputs.working_directory }}

    outputs:
      plan_artifact: ${{ steps.plan-metadata.outputs.plan_artifact }}

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref || github.ref }}

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          test -n "$AWS_ACCOUNT_ID" || {
            echo "AWS_ACCOUNT_ID GitHub variable is required."
            exit 1
          }

          test -n "$AWS_REGION" || {
            echo "AWS_REGION GitHub variable is required."
            exit 1
          }

          test -n "$PROJECT_NAME" || {
            echo "PROJECT_NAME GitHub variable is required."
            exit 1
          }

          test -n "$TERRAFORM_VERSION" || {
            echo "TERRAFORM_VERSION GitHub variable is required."
            exit 1
          }

          test -n "$TF_STATE_BUCKET" || {
            echo "TF_STATE_BUCKET GitHub variable is required."
            exit 1
          }

          test -n "$ROLE_TO_ASSUME" || {
            echo "ROLE_TO_ASSUME GitHub variable is required."
            exit 1
          }

          expected_account="$(cut -d: -f5 <<< "$ROLE_TO_ASSUME")"

          if [[ "$expected_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "ROLE_TO_ASSUME belongs to AWS account $expected_account,"
            echo "but AWS_ACCOUNT_ID is $AWS_ACCOUNT_ID."
            exit 1
          fi

      - name: Validate Terraform working directory
        shell: bash
        run: |
          set -euo pipefail

          echo "Current working directory: $(pwd)"
          echo "Expected repository-relative directory: ${{ needs.resolve-context.outputs.working_directory }}"

          test -f "main.tf" || {
            echo "::error::Terraform root module was not found in the current working directory."
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            find . -maxdepth 2 -print | sort
            exit 1
          }

          test -f "${{ needs.resolve-context.outputs.environment }}.tfvars" || {
            echo "::error::Expected variable file was not found: ${{ needs.resolve-context.outputs.environment }}.tfvars"
            exit 1
          }

          echo "Terraform root module and environment variable file were found."

      - name: Validate AWS provider authentication model
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.tf'             -E '^[[:space:]]*assume_role[[:space:]]*\{'             .; then
            echo "::error::Terraform provider contains an assume_role block."
            echo "The workflow already assumes ROLE_TO_ASSUME through GitHub OIDC."
            echo "Remove the provider assume_role block to avoid attempting to assume the same role twice."
            exit 1
          fi

          if grep -R --line-number             --include='*.tf'             --include='*.tfvars'             'aws_assume_role_arn'             .; then
            echo "::error::Obsolete aws_assume_role_arn configuration was found."
            echo "Remove it from provider.tf, variables.tf, and environment tfvars."
            exit 1
          fi

          echo "Terraform AWS provider will use the credentials supplied by GitHub OIDC."

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.PROJECT_NAME }}-${{ needs.resolve-context.outputs.environment }}-plan
          mask-aws-account-id: true

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Verify Terraform state bucket exists
        shell: bash
        run: |
          set -euo pipefail

          aws s3api head-bucket \
            --bucket "$TF_STATE_BUCKET"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ needs.resolve-context.outputs.state_key }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Create Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -var-file="${{ needs.resolve-context.outputs.environment }}.tfvars" \
            -out=tfplan \
            | tee terraform-plan.txt

      - name: Record plan metadata
        id: plan-metadata
        shell: bash
        run: |
          artifact_name="terraform-plan-${{ needs.resolve-context.outputs.environment }}-${GITHUB_RUN_ID}"
          echo "plan_artifact=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan-metadata.outputs.plan_artifact }}
          path: |
            ${{ needs.resolve-context.outputs.working_directory }}/tfplan
            ${{ needs.resolve-context.outputs.working_directory }}/terraform-plan.txt
            ${{ needs.resolve-context.outputs.working_directory }}/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 7

      - name: Add plan to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Terraform plan: ${{ needs.resolve-context.outputs.environment }}"
            echo
            echo '```text'
            tail -n 200 terraform-plan.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform apply - ${{ needs.resolve-context.outputs.environment }}
    runs-on: ubuntu-latest

    needs:
      - resolve-context
      - terraform-plan

    if: >-
      ${{
        always() &&
        needs.resolve-context.outputs.should_apply == 'true' &&
        needs.terraform-plan.result == 'success'
      }}

    environment:
      name: ${{ needs.resolve-context.outputs.environment }}

    env:
      TF_VAR_aws_assume_role_arn: ""

    defaults:
      run:
        working-directory: ${{ needs.resolve-context.outputs.working_directory }}

    outputs:
      cluster_name: ${{ steps.platform-outputs.outputs.cluster_name }}
      admin_instance_id: ${{ steps.platform-outputs.outputs.admin_instance_id }}
      artifact_bucket: ${{ steps.platform-outputs.outputs.artifact_bucket }}
      load_balancer_controller_role_arn: ${{ steps.platform-outputs.outputs.load_balancer_controller_role_arn }}
      vpc_id: ${{ steps.platform-outputs.outputs.vpc_id }}

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}

      - name: Validate AWS provider authentication model
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --include='*.tf'             -E '^[[:space:]]*assume_role[[:space:]]*\{'             .; then
            echo "::error::Terraform provider contains an assume_role block."
            echo "The workflow already assumes ROLE_TO_ASSUME through GitHub OIDC."
            echo "Remove the provider assume_role block to avoid attempting to assume the same role twice."
            exit 1
          fi

          if grep -R --line-number             --include='*.tf'             --include='*.tfvars'             'aws_assume_role_arn'             .; then
            echo "::error::Obsolete aws_assume_role_arn configuration was found."
            echo "Remove it from provider.tf, variables.tf, and environment tfvars."
            exit 1
          fi

          echo "Terraform AWS provider will use the credentials supplied by GitHub OIDC."

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.PROJECT_NAME }}-${{ needs.resolve-context.outputs.environment }}-apply
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Initialize Terraform
        shell: bash
        run: |
          set -euo pipefail

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ needs.resolve-context.outputs.state_key }}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Download approved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.terraform-plan.outputs.plan_artifact }}
          path: ${{ needs.resolve-context.outputs.working_directory }}

      - name: Apply approved Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -auto-approve \
            -lock-timeout=5m \
            tfplan

      - name: Read platform outputs
        id: platform-outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cluster_name="$(terraform output -raw cluster_name)"
          admin_instance_id="$(terraform output -raw eks_admin_instance_id)"
          artifact_bucket="$(terraform output -raw platform_artifact_bucket_name)"
          load_balancer_controller_role_arn="$(terraform output -raw aws_load_balancer_controller_iam_role_arn)"
          vpc_id="$(terraform output -raw vpc_id)"

          test -n "$cluster_name" || {
            echo "Terraform output 'cluster_name' is required."
            exit 1
          }

          test -n "$admin_instance_id" || {
            echo "Terraform output 'eks_admin_instance_id' is required."
            exit 1
          }

          test -n "$artifact_bucket" || {
            echo "Terraform output 'platform_artifact_bucket_name' is required."
            exit 1
          }

          test -n "$load_balancer_controller_role_arn" || {
            echo "Terraform output 'aws_load_balancer_controller_iam_role_arn' is required."
            exit 1
          }

          test -n "$vpc_id" || {
            echo "Terraform output 'vpc_id' is required."
            exit 1
          }

          {
            echo "cluster_name=$cluster_name"
            echo "admin_instance_id=$admin_instance_id"
            echo "artifact_bucket=$artifact_bucket"
            echo "load_balancer_controller_role_arn=$load_balancer_controller_role_arn"
            echo "vpc_id=$vpc_id"
          } >> "$GITHUB_OUTPUT"

      - name: Export Terraform outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          terraform output -json \
            > "terraform-outputs-${{ needs.resolve-context.outputs.environment }}.json"

      - name: Upload Terraform outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.resolve-context.outputs.environment }}-${{ github.run_id }}
          path: ${{ needs.resolve-context.outputs.working_directory }}/terraform-outputs-${{ needs.resolve-context.outputs.environment }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Infrastructure deployment completed"
            echo
            echo "- Project: \`${PROJECT_NAME}\`"
            echo "- Environment: \`${{ needs.resolve-context.outputs.environment }}\`"
            echo "- AWS account: \`${AWS_ACCOUNT_ID}\`"
            echo "- AWS region: \`${AWS_REGION}\`"
            echo "- State: \`s3://${TF_STATE_BUCKET}/${{ needs.resolve-context.outputs.state_key }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  install-platform-components:
    name: Install AWS Load Balancer Controller and Argo CD through SSM
    runs-on: ubuntu-latest

    needs:
      - resolve-context
      - terraform-apply

    if: >-
      ${{
        always() &&
        needs.resolve-context.outputs.should_apply == 'true' &&
        needs.terraform-apply.result == 'success'
      }}

    environment:
      name: ${{ needs.resolve-context.outputs.environment }}

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref }}

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.PROJECT_NAME }}-${{ needs.resolve-context.outputs.environment }}-ssm-platform
          mask-aws-account-id: true

      - name: Resolve platform installation inputs
        shell: bash
        env:
          ADMIN_INSTANCE_ID: ${{ needs.terraform-apply.outputs.admin_instance_id }}
          ARTIFACT_BUCKET: ${{ needs.terraform-apply.outputs.artifact_bucket }}
          CLUSTER_NAME: ${{ needs.terraform-apply.outputs.cluster_name }}
          LBC_ROLE_ARN: ${{ needs.terraform-apply.outputs.load_balancer_controller_role_arn }}
          VPC_ID: ${{ needs.terraform-apply.outputs.vpc_id }}
          ENVIRONMENT_NAME: ${{ needs.resolve-context.outputs.environment }}
        run: |
          set -euo pipefail

          if [[ -z "$LBC_ROLE_ARN" ]]; then
            role_name="task-tracking-${ENVIRONMENT_NAME}-aws-load-balancer-controller"
            LBC_ROLE_ARN="$(
              aws iam get-role \
                --role-name "$role_name" \
                --query 'Role.Arn' \
                --output text
            )"
          fi

          require_value() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::$name is required for platform installation."
              exit 1
            fi
          }

          require_value "ADMIN_INSTANCE_ID" "$ADMIN_INSTANCE_ID"
          require_value "ARTIFACT_BUCKET" "$ARTIFACT_BUCKET"
          require_value "CLUSTER_NAME" "$CLUSTER_NAME"
          require_value "LBC_ROLE_ARN" "$LBC_ROLE_ARN"
          require_value "VPC_ID" "$VPC_ID"

          if [[ ! -f "$ARGOCD_VALUES_FILE" ]]; then
            echo "::error::ARGOCD_VALUES_FILE was not found: $ARGOCD_VALUES_FILE"
            exit 1
          fi

          {
            echo "ADMIN_INSTANCE_ID=$ADMIN_INSTANCE_ID"
            echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET"
            echo "CLUSTER_NAME=$CLUSTER_NAME"
            echo "LBC_ROLE_ARN=$LBC_ROLE_ARN"
            echo "VPC_ID=$VPC_ID"
          } >> "$GITHUB_ENV"

      - name: Wait for the administration instance to be online in Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            status="$(
              aws ssm describe-instance-information \
                --region "$AWS_REGION" \
                --filters "Key=InstanceIds,Values=$ADMIN_INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || true
            )"

            if [[ "$status" == "Online" ]]; then
              echo "Administration instance is online in Systems Manager."
              exit 0
            fi

            echo "Waiting for SSM registration: attempt $attempt/40"
            sleep 15
          done

          echo "Administration instance did not become available in Systems Manager."
          exit 1

      - name: Create the platform installation script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/platform-install

          cp "$ARGOCD_VALUES_FILE" /tmp/platform-install/argocd-values.yaml

          cat > /tmp/platform-install/install-platform.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          if ! command -v kubectl >/dev/null 2>&1; then
            dnf install -y tar gzip
            curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/__KUBECTL_VERSION__/bin/linux/amd64/kubectl
            install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi

          if ! command -v helm >/dev/null 2>&1; then
            dnf install -y tar gzip
            curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-__HELM_VERSION__-linux-amd64.tar.gz
            tar -xzf /tmp/helm.tar.gz -C /tmp
            install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          fi

          kubectl version --client
          helm version

          mkdir -p /root/.kube
          export KUBECONFIG=/root/.kube/config

          aws eks update-kubeconfig \
            --region "__AWS_REGION__" \
            --name "__CLUSTER_NAME__" \
            --kubeconfig "$KUBECONFIG"

          kubectl cluster-info
          kubectl get nodes

          # EKS auto-creates a "gp2" StorageClass on every new cluster but
          # never marks it default, and the aws-ebs-csi-driver EKS addon
          # (installed via Terraform) does not manage StorageClass objects
          # itself. Without a default class, PVCs with no storageClassName
          # (e.g. the mysql/elasticsearch StatefulSets) stay Pending forever.
          kubectl patch storageclass gp2 \
            -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

          kubectl create serviceaccount aws-load-balancer-controller \
            --namespace kube-system \
            --dry-run=client \
            --output yaml |
            kubectl apply -f -

          kubectl annotate serviceaccount aws-load-balancer-controller \
            --namespace kube-system \
            eks.amazonaws.com/role-arn="__LBC_ROLE_ARN__" \
            --overwrite

          helm repo add eks https://aws.github.io/eks-charts --force-update
          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm repo update

          if ! helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="__CLUSTER_NAME__" \
            --set region="__AWS_REGION__" \
            --set vpcId="__VPC_ID__" \
            --set serviceAccount.create=false \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set replicaCount=1 \
            --wait \
            --timeout 30m; then
            kubectl get pods --namespace kube-system --output wide
            kubectl describe deployment aws-load-balancer-controller --namespace kube-system || true
            kubectl get events --namespace kube-system --sort-by=.lastTimestamp | tail -n 80 || true
            kubectl logs --namespace kube-system deployment/aws-load-balancer-controller --all-containers=true --tail=200 || true
            exit 1
          fi

          # The controller briefly serves a self-signed bootstrap cert before
          # hot-swapping to the persisted webhook TLS secret, so a pod passing
          # --wait's readiness check does not guarantee the webhook TLS is
          # ready yet. Actively probe it with a throwaway dry-run Service
          # (which routes through the same mutating webhook ArgoCD's install
          # will hit) before proceeding.
          webhook_ready=false
          for attempt in $(seq 1 24); do
            if kubectl create service clusterip webhook-warmup-check \
              --tcp=80:80 \
              --namespace kube-system \
              --dry-run=server \
              --output name >/dev/null 2>&1; then
              webhook_ready=true
              break
            fi
            echo "Waiting for aws-load-balancer-webhook to accept requests: attempt ${attempt}/24"
            sleep 5
          done

          if [[ "${webhook_ready}" != "true" ]]; then
            echo "::error::aws-load-balancer-webhook did not become ready in time"
            kubectl get pods --namespace kube-system --output wide
            kubectl logs --namespace kube-system deployment/aws-load-balancer-controller --all-containers=true --tail=200 || true
            exit 1
          fi

          argocd_version_args=()
          if [[ -n "__ARGOCD_CHART_VERSION__" ]]; then
            argocd_version_args=(--version "__ARGOCD_CHART_VERSION__")
          fi

          helm upgrade --install "__ARGOCD_RELEASE_NAME__" argo/argo-cd \
            --namespace "__ARGOCD_NAMESPACE__" \
            --create-namespace \
            "${argocd_version_args[@]}" \
            --values /opt/platform-install/argocd-values.yaml \
            --atomic \
            --cleanup-on-fail \
            --wait \
            --timeout 20m

          helm status aws-load-balancer-controller --namespace kube-system
          helm status "__ARGOCD_RELEASE_NAME__" --namespace "__ARGOCD_NAMESPACE__"
          kubectl get pods --all-namespaces
          SCRIPT

          sed -i \
            -e "s|__AWS_REGION__|${AWS_REGION}|g" \
            -e "s|__CLUSTER_NAME__|${CLUSTER_NAME}|g" \
            -e "s|__LBC_ROLE_ARN__|${LBC_ROLE_ARN}|g" \
            -e "s|__VPC_ID__|${VPC_ID}|g" \
            -e "s|__ARGOCD_RELEASE_NAME__|${ARGOCD_RELEASE_NAME}|g" \
            -e "s|__ARGOCD_NAMESPACE__|${ARGOCD_NAMESPACE}|g" \
            -e "s|__ARGOCD_CHART_VERSION__|${ARGOCD_CHART_VERSION}|g" \
            -e "s|__KUBECTL_VERSION__|${KUBECTL_VERSION}|g" \
            -e "s|__HELM_VERSION__|${HELM_VERSION}|g" \
            /tmp/platform-install/install-platform.sh

          chmod 0755 /tmp/platform-install/install-platform.sh

      - name: Upload platform installation assets
        shell: bash
        run: |
          set -euo pipefail

          prefix="platform-install/${{ needs.resolve-context.outputs.environment }}/${GITHUB_RUN_ID}"

          aws s3 cp \
            /tmp/platform-install/install-platform.sh \
            "s3://${ARTIFACT_BUCKET}/${prefix}/install-platform.sh" \
            --sse aws:kms

          aws s3 cp \
            /tmp/platform-install/argocd-values.yaml \
            "s3://${ARTIFACT_BUCKET}/${prefix}/argocd-values.yaml" \
            --sse aws:kms

          echo "PLATFORM_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Install platform components through Systems Manager
        id: ssm-command
        shell: bash
        run: |
          set -euo pipefail

          parameters="$(
            jq -n \
              --arg bucket "$ARTIFACT_BUCKET" \
              --arg prefix "$PLATFORM_PREFIX" \
              '{
                commands: [
                  "set -euo pipefail",
                  "mkdir -p /opt/platform-install",
                  ("aws s3 cp s3://" + $bucket + "/" + $prefix + "/install-platform.sh /opt/platform-install/install-platform.sh"),
                  ("aws s3 cp s3://" + $bucket + "/" + $prefix + "/argocd-values.yaml /opt/platform-install/argocd-values.yaml"),
                  "chmod 0755 /opt/platform-install/install-platform.sh",
                  "/opt/platform-install/install-platform.sh"
                ]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$ADMIN_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Install AWS Load Balancer Controller and Argo CD" \
              --parameters "$parameters" \
              --timeout-seconds 3600 \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          status="Pending"
          for attempt in $(seq 1 130); do
            status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$ADMIN_INSTANCE_ID" \
                --query 'Status' \
                --output text
            )"

            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                echo "SSM platform install status: $status, attempt $attempt/130"
                sleep 30
                ;;
              *)
                echo "Unexpected SSM command status: $status"
                sleep 30
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$ADMIN_INSTANCE_ID" \
            --query '{
              Status:Status,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'

          if [[ "$status" != "Success" ]]; then
            echo "SSM platform install finished with status: $status"
            exit 1
          fi

      - name: Display Systems Manager command result
        if: always()
        shell: bash
        env:
          COMMAND_ID: ${{ steps.ssm-command.outputs.command_id }}
        run: |
          set -euo pipefail

          if [[ -z "${COMMAND_ID:-}" ]]; then
            echo "No Systems Manager command ID was produced."
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$ADMIN_INSTANCE_ID" \
            --query '{
              Status:Status,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }'

      - name: Platform installation summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Private EKS platform installation completed"
            echo
            echo "- Environment: \`${{ needs.resolve-context.outputs.environment }}\`"
            echo "- EKS cluster: \`${CLUSTER_NAME}\`"
            echo "- EKS public endpoint: \`disabled\`"
            echo "- SSM administration instance: \`${ADMIN_INSTANCE_ID}\`"
            echo "- AWS Load Balancer Controller: \`installed through Helm over SSM\`"
            echo "- Argo CD: \`installed through Helm over SSM\`"
          } >> "$GITHUB_STEP_SUMMARY"
