name: ci

on:
  pull_request:
    branches:
      - uat
      - production
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/uat
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false
      - run: terraform validate

  checkov:
    name: Checkov scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
      - name: Upload Checkov scan result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-scan-result
          path: checkov.sarif
          if-no-files-found: warn

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
      - name: Upload Trivy filesystem scan result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem-scan-result
          path: trivy-fs.sarif
          if-no-files-found: warn

  push-images:
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - terraform
      - provision-dev-infra
      - trivy
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME || vars.ROLE_TO_ASSUME }}
      ECR_BACKEND_REPOSITORY: ${{ needs.provision-dev-infra.outputs.backend_repository }}
      ECR_FRONTEND_REPOSITORY: ${{ needs.provision-dev-infra.outputs.frontend_repository }}
    outputs:
      backend_image: ${{ steps.image-refs.outputs.backend_image }}
      frontend_image: ${{ steps.image-refs.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ECR publish configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION is required"; exit 1; }
          test -n "$ROLE_TO_ASSUME" || { echo "ROLE_TO_ASSUME is required"; exit 1; }
          test -n "$ECR_BACKEND_REPOSITORY" || { echo "ECR_BACKEND_REPOSITORY is required"; exit 1; }
          test -n "$ECR_FRONTEND_REPOSITORY" || { echo "ECR_FRONTEND_REPOSITORY is required"; exit 1; }
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
      - name: Verify ECR repositories exist
        run: |
          for repository in "$ECR_BACKEND_REPOSITORY" "$ECR_FRONTEND_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repository" >/dev/null
          done
      - name: Build backend image
        run: docker build -t $ECR_BACKEND_REPOSITORY:$GITHUB_SHA -t $ECR_BACKEND_REPOSITORY:latest backend
      - name: Build frontend image
        run: docker build -t $ECR_FRONTEND_REPOSITORY:$GITHUB_SHA -t $ECR_FRONTEND_REPOSITORY:latest frontend
      - name: Scan backend image before push
        id: scan-backend-image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        continue-on-error: true
      - name: Scan frontend image before push
        id: scan-frontend-image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          format: sarif
          output: trivy-frontend-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        continue-on-error: true
      - name: Upload Trivy image scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-scan-results
          path: |
            trivy-backend-image.sarif
            trivy-frontend-image.sarif
          if-no-files-found: warn
      - name: Enforce Trivy image scan gate
        if: always()
        run: |
          if [ "${{ steps.scan-backend-image.outcome }}" != "success" ] || [ "${{ steps.scan-frontend-image.outcome }}" != "success" ]; then
            echo "Trivy found CRITICAL or HIGH image vulnerabilities."
            exit 1
          fi
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag backend image for ECR
        run: |
          docker tag $ECR_BACKEND_REPOSITORY:$GITHUB_SHA ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPOSITORY:$GITHUB_SHA
          docker tag $ECR_BACKEND_REPOSITORY:latest ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPOSITORY:latest
      - name: Tag frontend image for ECR
        run: |
          docker tag $ECR_FRONTEND_REPOSITORY:$GITHUB_SHA ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:$GITHUB_SHA
          docker tag $ECR_FRONTEND_REPOSITORY:latest ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:latest
      - name: Push backend image
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPOSITORY:$GITHUB_SHA
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPOSITORY:latest
      - name: Push frontend image
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:$GITHUB_SHA
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:latest
      - name: Export pushed image references
        id: image-refs
        run: |
          echo "backend_image=${{ steps.ecr-login.outputs.registry }}/$ECR_BACKEND_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ steps.ecr-login.outputs.registry }}/$ECR_FRONTEND_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to dev EKS
    runs-on: ubuntu-latest
    needs:
      - provision-dev-infra
      - push-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME || vars.ROLE_TO_ASSUME }}
      CLUSTER_NAME: ${{ needs.provision-dev-infra.outputs.cluster_name }}
      BACKEND_IMAGE: ${{ needs.push-images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.push-images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION is required"; exit 1; }
          test -n "$ROLE_TO_ASSUME" || { echo "ROLE_TO_ASSUME is required"; exit 1; }
          test -n "$CLUSTER_NAME" || { echo "CLUSTER_NAME is required"; exit 1; }
          test -n "$BACKEND_IMAGE" || { echo "BACKEND_IMAGE is required"; exit 1; }
          test -n "$FRONTEND_IMAGE" || { echo "FRONTEND_IMAGE is required"; exit 1; }
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - name: Apply Kubernetes manifests
        working-directory: ${{ github.workspace }}
        run: kubectl apply -k k8s
      - name: Deploy pushed images
        working-directory: ${{ github.workspace }}
        run: |
          kubectl -n backend set image deployment/backend backend="$BACKEND_IMAGE"
          kubectl -n frontend set image deployment/frontend frontend="$FRONTEND_IMAGE"
      - name: Wait for rollouts
        working-directory: ${{ github.workspace }}
        run: |
          kubectl -n database rollout status statefulset/mysql --timeout=5m
          kubectl -n backend rollout status deployment/backend --timeout=5m
          kubectl -n frontend rollout status deployment/frontend --timeout=5m

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'dev' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v4
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}

  production-approval:
    name: Manual approval for production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'production' && github.head_ref == 'uat' }}
    environment:
      name: production
    steps:
      - run: echo "Approved promotion from uat to production."

  provision-dev-infra:
    name: Provision dev infrastructure
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 90
    outputs:
      backend_repository: ${{ steps.infra-outputs.outputs.backend_repository }}
      frontend_repository: ${{ steps.infra-outputs.outputs.frontend_repository }}
      cluster_name: ${{ steps.infra-outputs.outputs.cluster_name }}
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ROLE_TO_ASSUME: ${{ secrets.ROLE_TO_ASSUME || vars.ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Validate AWS configuration
        run: |
          test -n "$AWS_REGION" || { echo "AWS_REGION is required"; exit 1; }
          test -n "$ROLE_TO_ASSUME" || { echo "ROLE_TO_ASSUME is required"; exit 1; }
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
      - name: Initialize Terraform
        run: terraform init
      - name: Apply dev infrastructure
        run: terraform apply -var-file=dev.tfvars -var='aws_assume_role_arn=' -auto-approve
      - name: Read infrastructure outputs
        id: infra-outputs
        run: |
          repositories="$(terraform output -json ecr_repository_urls)"
          backend_repository="$(echo "$repositories" | jq -r 'keys[] | select(test("backend$"))')"
          frontend_repository="$(echo "$repositories" | jq -r 'keys[] | select(test("frontend$"))')"
          cluster_name="$(terraform output -raw cluster_name)"

          test -n "$backend_repository" || { echo "Backend ECR repository output was not found"; exit 1; }
          test -n "$frontend_repository" || { echo "Frontend ECR repository output was not found"; exit 1; }
          test -n "$cluster_name" || { echo "cluster_name output was not found"; exit 1; }

          echo "backend_repository=$backend_repository" >> "$GITHUB_OUTPUT"
          echo "frontend_repository=$frontend_repository" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$cluster_name" >> "$GITHUB_OUTPUT"