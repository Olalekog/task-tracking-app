apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracking-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Olalekog/task-tracking-app.git
    targetRevision: dev
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
